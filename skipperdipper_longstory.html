<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>SkipperDipper — Vermisst in Neonstadt (Long Story Demo)</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  html,body { height:100%; margin:0; background:#0b0f1a; color:#e6eef8; font-family: "Segoe UI", Roboto, Arial, sans-serif; }
  #game-container { width:100%; height:100vh; overflow:hidden; }
  #notes { position:fixed; right:12px; top:12px; width:300px; max-height:80vh; overflow:auto; background:rgba(10,10,20,0.7); padding:10px; border-radius:8px; font-size:13px; display:none; z-index:9999; }
  #notes h3 { margin:0 0 6px 0; font-size:15px; }
  .clue-item { padding:6px; border-bottom:1px solid rgba(255,255,255,0.04); cursor:pointer; }
  .smallhint { font-size:12px; color:#9fb1c8; margin-top:6px; }
</style>
</head>
<body>
<div id="game-container"></div>
<div id="notes">
  <h3>Inventar & Hinweise (I drücken zum Schließen)</h3>
  <div id="cluesList"></div>
  <div class="smallhint">Klicke einen Hinweis um die Beschreibung zu sehen.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
<script>
/*
  SkipperDipper — Long Story Version
  - 6 Kapitel/Orte (Wohnung, Nachtmarkt, Jazz-Club, Archiv, Untergrund, Finale)
  - 30 Hinweise (müssen alle gesammelt werden, um Lina zu retten)
  - Perspektivwechsel Top-Down <-> Side an Zonen
  - Sprechblasen, Inventar-UI, NPC-Dialoge
  - Platzhalter-Grafiken (programmatisch)
*/

const config = {
  type: Phaser.AUTO,
  parent: 'game-container',
  width: 1000,
  height: 640,
  backgroundColor: '#08101a',
  physics: {
    default: 'arcade',
    arcade: { gravity: { y: 900 }, debug: false }
  },
  scene: [PreloadScene, MainScene]
};

new Phaser.Game(config);

/* ---------------- PreloadScene ---------------- */
function PreloadScene() {
  Phaser.Scene.call(this, { key: 'PreloadScene' });
}
PreloadScene.prototype = Object.create(Phaser.Scene.prototype);
PreloadScene.prototype.constructor = PreloadScene;
PreloadScene.prototype.preload = function() {
  // no external assets; we'll draw placeholders in create()
};
PreloadScene.prototype.create = function() {
  const g = this.add.graphics();

  // Player Top-down placeholder
  g.fillStyle(0x2b6b8a,1).fillRoundedRect(0,0,48,48,8);
  g.lineStyle(2,0xffffff).strokeRoundedRect(0,0,48,48,8);
  g.generateTexture('player_top',48,48);
  g.clear();

  // Player Side placeholder
  g.fillStyle(0x2b6b8a,1).fillRoundedRect(0,0,40,56,8);
  g.lineStyle(2,0xffffff).strokeRoundedRect(0,0,40,56,8);
  g.generateTexture('player_side',40,56);
  g.clear();

  // NPC placeholder
  g.fillStyle(0xb85e9e,1).fillRoundedRect(0,0,40,48,6);
  g.lineStyle(2,0xffffff).strokeRoundedRect(0,0,40,48,6);
  g.generateTexture('npc',40,48);
  g.clear();

  // Clue icon
  g.fillStyle(0xf6c85f,1).fillCircle(12,12,12);
  g.lineStyle(2,0x222831).strokeCircle(12,12,12);
  g.generateTexture('clue',24,24);
  g.clear();

  // Door / final door
  g.fillStyle(0x2f3948,1).fillRoundedRect(0,0,120,200,8);
  g.lineStyle(3,0xffffff).strokeRoundedRect(0,0,120,200,8);
  g.generateTexture('door',120,200);
  g.clear();

  // Platform tile
  g.fillStyle(0x2f4f63,1).fillRect(0,0,240,32);
  g.generateTexture('platform',240,32);
  g.clear();

  this.scene.start('MainScene');
};

/* ---------------- MainScene ---------------- */
function MainScene() {
  Phaser.Scene.call(this, { key: 'MainScene' });
}
MainScene.prototype = Object.create(Phaser.Scene.prototype);
MainScene.prototype.constructor = MainScene;

MainScene.prototype.create = function() {
  // Game state
  this.mode = 'top'; // 'top' or 'side'
  this.cluesFound = 0;
  this.requiredClues = 30;
  this.collected = {}; // map id->true
  this.currentZone = 'Wohnung'; // initial location
  this.inSwitchZone = false;

  // Create large world (single canvas with zones)
  this.cameras.main.setBackgroundColor(0x07121a);
  this.cameras.main.setZoom(1);

  // Create world groups
  this.topGroup = this.add.group();
  this.sideGroup = this.add.group();

  // Create rooms/zones rectangles (visual guides)
  // We'll place six zones horizontally to walk through (for top view) - but also allow side sections
  this.zones = {
    'Wohnung': { x:120, y:320, w:380, h:380, mode:'side' },
    'Nachtmarkt': { x:520, y:160, w:600, h:360, mode:'top' },
    'JazzClub': { x:1140, y:320, w:420, h:380, mode:'side' },
    'Archiv': { x:1700, y:160, w:680, h:360, mode:'top' },
    'Untergrund': { x:2340, y:320, w:540, h:380, mode:'side' },
    'Finale': { x:2940, y:260, w:420, h:460, mode:'side' }
  };

  // Visual zone backgrounds (subtle)
  for (const [name, z] of Object.entries(this.zones)) {
    const rect = this.add.rectangle(z.x, z.y, z.w, z.h, 0x0f2430).setAlpha(0.35);
    const label = this.add.text(z.x - z.w/2 + 8, z.y - z.h/2 + 8, name, { fontSize:'16px', color:'#cfe8ff' });
    rect.setDepth(-1);
  }

  // Player
  this.player = this.physics.add.sprite(this.zones['Wohnung'].x, this.zones['Wohnung'].y, 'player_side');
  this.player.setCollideWorldBounds(true);
  this.player.body.setSize(30,50,true);

  // Camera
  this.cameras.main.startFollow(this.player, true, 0.08, 0.08);
  this.cameras.main.setBounds(0,0,3600,800);
  this.physics.world.setBounds(0,0,3600,800);

  // Platforms for side areas (global group; visible only in side mode)
  this.platforms = this.physics.add.staticGroup();
  // create some example platforms in side zones
  this.createSidePlatforms();

  // Clues data (30 clues) - id, zone, x,y, title, description
  this.clues = this.createCluesData();

  // Place clue sprites
  this.clueSprites = {};
  for (const c of this.clues) {
    const s = this.physics.add.staticImage(c.x, c.y, 'clue');
    s.setData('meta', c);
    s.setVisible(!c.collected);
    this.clueSprites[c.id] = s;
  }

  // NPCs with dialogues (some are top, some side)
  this.npcs = this.createNPCs();

  this.npcSprites = [];
  for (const n of this.npcs) {
    const s = this.physics.add.staticImage(n.x, n.y, 'npc');
    s.setData('meta', n);
    this.npcSprites.push(s);
  }

  // Final door (closed until all clues are found)
  const final = this.zones['Finale'];
  this.finalDoor = this.physics.add.staticImage(final.x + final.w/2 - 80, final.y + final.h/2 - 60, 'door');
  this.finalDoor.setData('isLocked', true);

  // Overlaps: player <-> clue, player <-> npc, player <-> final door
  for (const s of Object.values(this.clueSprites)) {
    this.physics.add.overlap(this.player, s, (p, obj) => { /* handled by interactive key */ }, null, this);
  }
  for (const s of this.npcSprites) {
    this.physics.add.overlap(this.player, s, (p, obj) => {
      // show hint to press space
      this.hintText.setText("Drücke LEER um zu sprechen / Interagieren");
      this.nearNPC = obj;
    }, null, this);
  }
  this.physics.add.overlap(this.player, this.finalDoor, (p, d) => {
    this.hintText.setText("Drücke LEER um die Tür zu prüfen");
    this.nearFinal = d;
  }, null, this);

  // Input
  this.cursors = this.input.keyboard.createCursorKeys();
  this.keyE = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.E);
  this.keySpace = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
  this.keyI = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.I);

  // UI
  this.hintText = this.add.text(12,12,"", { fontSize:'18px', color:'#dfe6ef' }).setScrollFactor(0);
  this.locationText = this.add.text(12,40,"Ort: Wohnung", { fontSize:'18px', color:'#ffd166' }).setScrollFactor(0);
  this.clueCounter = this.add.text(12,68,`Hinweise: ${this.cluesFound}/${this.requiredClues}`, { fontSize:'16px', color:'#9be7ff' }).setScrollFactor(0);

  // Speech bubble
  this.bubble = this.add.container(0,0).setDepth(100).setVisible(false);

  // Inventory UI (DOM)
  this.notesPanel = document.getElementById('notes');
  this.cluesListDiv = document.getElementById('cluesList');
  document.addEventListener('keydown', (e) => {
    if (e.key.toLowerCase() === 'i') {
      this.toggleInventory();
    }
  });

  // initial mode set by initial zone
  this.applyModeForZone('Wohnung');

  // message
  this.showSpeech("Ich bin SkipperDipper. Lina Marquart ist verschwunden. Sammle Hinweise, um die Wahrheit zu finden.", 4200);
};

/* Create side platforms across side zones */
MainScene.prototype.createSidePlatforms = function() {
  // Wohnung platforms
  const w = this.zones['Wohnung'];
  this.platforms.create(w.x-80, w.y+140, 'platform').setScale(0.8,1).refreshBody();
  this.platforms.create(w.x+90, w.y+60, 'platform').setScale(0.5,1).refreshBody();

  // JazzClub
  const j = this.zones['JazzClub'];
  this.platforms.create(j.x-50, j.y+160, 'platform').setScale(0.9,1).refreshBody();
  this.platforms.create(j.x+110, j.y+40, 'platform').setScale(0.5,1).refreshBody();

  // Untergrund
  const u = this.zones['Untergrund'];
  this.platforms.create(u.x-30, u.y+160, 'platform').setScale(0.9,1).refreshBody();
  this.platforms.create(u.x+130, u.y+40, 'platform').setScale(0.5,1).refreshBody();

  // Finale area - small platforms
  const f = this.zones['Finale'];
  this.platforms.create(f.x+20, f.y+200, 'platform').setScale(0.8,1).refreshBody();
};

/* Show speech bubble helper */
MainScene.prototype.showSpeech = function(text, duration=2500) {
  this.bubble.removeAll(true);
  const padding = 12;
  const txt = this.add.text(0,0, text, { fontSize:'16px', color:'#07121a', wordWrap:{ width:360 } });
  const w = txt.width + padding*2, h = txt.height + padding*2;
  const bg = this.add.graphics();
  bg.fillStyle(0xf8f9fa,1).fillRoundedRect(-w/2, -h - 22, w, h, 8);
  bg.lineStyle(2,0x07121a).strokeRoundedRect(-w/2, -h - 22, w, h, 8);
  bg.fillTriangle(-10, -22, 10, -22, 0, -8);
  txt.setOrigin(0.5,1);
  this.bubble.add([bg, txt]);
  this.bubble.setVisible(true);
  this.bubble.x = this.player.x;
  this.bubble.y = this.player.y - (this.mode==='top'?40:80);
  if (this.bubbleTimer) this.time.removeEvent(this.bubbleTimer);
  this.bubbleTimer = this.time.addEvent({ delay: duration, callback: ()=>{ this.bubble.setVisible(false); }});
};

/* Toggle inventory DOM */
MainScene.prototype.toggleInventory = function() {
  if (this.notesPanel.style.display === 'block') {
    this.notesPanel.style.display = 'none';
  } else {
    this.notesPanel.style.display = 'block';
    // Populate list
    this.cluesListDiv.innerHTML = '';
    for (const c of this.clues) {
      const el = document.createElement('div');
      el.className = 'clue-item';
      el.textContent = `${c.title} ${this.collected[c.id] ? '✔' : ''}`;
      el.onclick = () => { alert(`${c.title}\n\n${c.desc}`); };
      this.cluesListDiv.appendChild(el);
    }
  }
};

/* Update loop */
MainScene.prototype.update = function(time, delta) {
  // Movement logic based on mode
  if (this.mode === 'top') {
    // top-down movement (no gravity)
    this.player.body.setAllowGravity(false);
    const speed = 190;
    let vx = 0, vy = 0;
    if (this.cursors.left.isDown) vx = -speed;
    else if (this.cursors.right.isDown) vx = speed;
    if (this.cursors.up.isDown) vy = -speed;
    else if (this.cursors.down.isDown) vy = speed;
    this.player.setVelocity(vx, vy);
  } else {
    // side-scroller movement
    this.player.body.setAllowGravity(true);
    const speed = 180;
    if (this.cursors.left.isDown) this.player.setVelocityX(-speed);
    else if (this.cursors.right.isDown) this.player.setVelocityX(speed);
    else this.player.setVelocityX(0);
    if (this.cursors.up.isDown && this.player.body.onFloor()) this.player.setVelocityY(-420);
  }

  // Keep speech bubble position
  if (this.bubble.visible) {
    this.bubble.x = this.player.x;
    this.bubble.y = this.player.y - (this.mode==='top'?40:80);
  }

  // Check which zone player is in
  for (const [name,z] of Object.entries(this.zones)) {
    const left = z.x - z.w/2, right = z.x + z.w/2, top = z.y - z.h/2, bottom = z.y + z.h/2;
    if (this.player.x >= left && this.player.x <= right && this.player.y >= top && this.player.y <= bottom) {
      if (this.currentZone !== name) {
        this.currentZone = name;
        this.locationText.setText(`Ort: ${name}`);
        this.applyModeForZone(name);
      }
    }
  }

  // Reset small dynamic hints
  this.hintText.setText('');

  // Interactions: Space key
  if (Phaser.Input.Keyboard.JustDown(this.keySpace)) {
    // NPC interaction (if nearNPC set)
    if (this.nearNPC) {
      const meta = this.nearNPC.getData('meta');
      this.showSpeech(meta.lines[Math.floor(Math.random()*meta.lines.length)], 2800);
      return;
    }
    // Clue pickup check: find nearest visible clue within radius
    let picked = false;
    for (const c of this.clues) {
      if (this.collected[c.id]) continue;
      const dx = Phaser.Math.Distance.Between(this.player.x,this.player.y, c.x,c.y);
      if (dx < 60 && this.isInSameZone(c.zone)) {
        this.collectClue(c);
        picked = true;
        break;
      }
    }
    if (picked) return;

    // Final door interaction
    if (this.nearFinal) {
      const locked = this.finalDoor.getData('isLocked');
      if (locked) {
        if (this.cluesFound >= this.requiredClues) {
          this.finalDoor.setData('isLocked', false);
          this.showSpeech("Du hast alle Hinweise! Die Tür öffnet sich...", 3000);
          // reveal Lina (safe) and trigger final sequence
          this.time.delayedCall(1200, ()=>{ this.revealFinalScene(); });
        } else {
          this.showSpeech("Die Tür ist verschlossen. Es fehlen Hinweise.", 2200);
        }
      } else {
        // door already unlocked - immediate final
        this.revealFinalScene();
      }
      return;
    }

    // default: no interaction hint
    this.showSpeech("Nichts zu tun.", 1400);
  }

  // Mode switch: E to force switch if zone allows switching
  if (Phaser.Input.Keyboard.JustDown(this.keyE)) {
    // determine allowed switch in certain zones (Wohnung, JazzClub, Untergrund, Finale are side; Nachtmarkt & Archiv top)
    // Only allow switch if target mode differs from zone mode
    const targetMode = this.zones[this.currentZone].mode;
    if (this.mode !== targetMode) {
      this.switchToMode(targetMode);
      this.showSpeech(`Wechsel zur ${targetMode==='top'?'Vogelperspektive':'Seitenansicht'}`, 1400);
    } else {
      this.showSpeech('Hier ist kein Perspektivwechsel möglich.', 1200);
    }
  }
};

/* Check if clue zone equals player's zone */
MainScene.prototype.isInSameZone = function(zoneName) {
  return zoneName === this.currentZone;
};

/* Collect clue */
MainScene.prototype.collectClue = function(clue) {
  if (this.collected[clue.id]) return;
  this.collected[clue.id] = true;
  this.cluesFound++;
  // hide sprite
  const sprite = this.clueSprites[clue.id];
  if (sprite) sprite.setVisible(false);
  this.clueCounter.setText(`Hinweise: ${this.cluesFound}/${this.requiredClues}`);
  this.showSpeech(`Hinweis gesammelt: ${clue.title}`, 1600);
  // Auto-open inventory briefly if many clues found
  if (this.cluesFound % 6 === 0) this.toggleInventory();
};

/* Apply mode for zone (set physics / visibility) */
MainScene.prototype.applyModeForZone = function(zoneName) {
  const mode = this.zones[zoneName].mode;
  this.switchToMode(mode);
};

/* Switch mode helper */
MainScene.prototype.switchToMode = function(mode) {
  if (mode === this.mode) return;
  this.mode = mode;
  if (mode === 'top') {
    // top-mode: no gravity, show top visuals (we use same placeholders)
    this.player.setTexture('player_top');
    this.player.body.setSize(36,36,true);
    this.player.setVelocity(0,0);
    // disable platform collisions
    this.physics.world.colliders.each((c) => {
      if (c.object2 === this.platforms) c.destroy();
    });
  } else {
    // side mode
    this.player.setTexture('player_side');
    this.player.body.setSize(30,50,true);
    // enable collisions with platforms
    this.physics.add.collider(this.player, this.platforms);
  }
};

/* Reveal final scene and ending */
MainScene.prototype.revealFinalScene = function() {
  // spawn Lina near final door (free her)
  if (this.linaRescued) {
    this.showSpeech("Lina ist bereits in Sicherheit.", 1800);
    return;
  }
  this.linaRescued = true;
  const final = this.zones['Finale'];
  this.lina = this.add.sprite(final.x + final.w/2 - 40, final.y + final.h/2 + 10, 'npc').setScale(1);
  this.showSpeech("Du hast Lina gefunden! Der Fall ist gelöst — doch Neonstadt hat weitere Geheimnisse...", 5200);
  // optional: disable Gerrit NPC or trigger final dialogue
  // spawn Gerrit (enemy) and short tension
  const gerrit = this.add.sprite(final.x + final.w/2 + 120, final.y + final.h/2 - 20, 'npc');
  this.time.delayedCall(3000, ()=> {
    this.showSpeech("Gerrit floh... Die Akten sind nun öffentlich. Gute Arbeit.", 4200);
  });
};

/* End of MainScene */
</script>
